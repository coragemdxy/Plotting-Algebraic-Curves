name: Bug report
description: Report an incorrect result, exception, or regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve PlotCurveTopologyForBivariatePolynomial.jl.
  - type: textarea
    id: polynomial
    attributes:
      label: Polynomial and code
      description: Provide a minimal Julia example that constructs the polynomial.
      render: julia
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result or error
    validations:
      required: true
  - type: input
    id: julia
    attributes:
      label: Julia version
      placeholder: "1.12.6"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Package status
      description: Paste `using Pkg; Pkg.status()` from the active project.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include precision arguments and any relevant plots or logs.
